schema_version: ores.stack.v2
project:
  version: 1
  pages_dir: src/pages
  out_dir: .ores-stack
  dist_dir: dist
  strict: true
  build:
    contracts: []
    client_mash: []
    client_leptos: []
    client_dioxus: []
    server: [cargo, build, --release, --locked]
    prerender: []
    package: []
  dev:
    preflight: []
    server: [sh, -c, "exec sleep 60"]
    watch: [src, .ores-stack.yaml]
    ignore: [.git, .ores-stack, target, dist]
    cargo_target_dir: target
    reload_bind: "127.0.0.1:0"
    browser_reload: true
