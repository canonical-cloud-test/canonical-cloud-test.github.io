name: company-readiness-canary

on:
  pull_request:
    paths:
      - tests/company-readiness/**
      - .github/workflows/company-readiness-canary.yml
  push:
    branches: [main]
    paths:
      - tests/company-readiness/**
      - .github/workflows/company-readiness-canary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact public canary snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact Canonical auditor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-company-auditor.rs
          ref: d981c0d26be8cafa7a6de12db8fc44cb989f093a
          path: source/company-auditor
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Test exact auditor source
        run: cargo test --locked --all-targets --manifest-path source/company-auditor/Cargo.toml

      - name: Validate public-safe snapshot
        run: >-
          cargo run --locked --manifest-path source/company-auditor/Cargo.toml --
          validate
          --manifest tests/company-readiness/company.json
          --evidence tests/company-readiness/evidence.json

      - name: Run NIST, SOC 2, and ISO public-scope readiness canary
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/canonical-company-readiness.md"
          cargo run --locked --manifest-path source/company-auditor/Cargo.toml -- \
            assess \
            --manifest tests/company-readiness/company.json \
            --evidence tests/company-readiness/evidence.json \
            --format markdown \
            --fail-on never \
            --output "$report"
          test -s "$report"
          cat "$report"
          grep -F 'change.protected-paths' "$report"
          for framework in \
            iso-iec-27001-2022 \
            nist-800-53-r5 \
            nist-csf-2.0 \
            soc2-tsc-2017-2022; do
            grep -F "\`$framework\`" "$report"
          done
          {
            echo '# Canonical Cloud public-scope readiness canary'
            echo
            echo '> This public canary validates the pinned assessment machinery against public repository metadata only. Unknown means missing current evidence; this is not independent assurance, certification, authorization, or a full-company assessment.'
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise all built-in framework mappings without asserting applicability
        shell: bash
        run: |
          set -euo pipefail
          mapping_evidence="$RUNNER_TEMP/mapping-evidence.json"
          mapping_report="$RUNNER_TEMP/all-framework-mappings.md"
          python3 - <<'PY' > "$mapping_evidence"
          import json
          source = json.load(open('tests/company-readiness/evidence.json', encoding='utf-8'))
          source['tenantId'] = 'canonical-cloud-public-mapping-canary'
          source['scopeId'] = 'organization/canonical-cloud/public-mapping-coverage'
          for observation in source['observations']:
              observation['subject'] = observation['subject'].replace(
                  'organization/canonical-cloud/public-engineering-governance',
                  'organization/canonical-cloud/public-mapping-coverage',
                  1,
              )
          print(json.dumps(source, indent=2, sort_keys=True))
          PY
          cargo run --locked --manifest-path source/company-auditor/Cargo.toml -- \
            validate \
            --manifest tests/company-readiness/company-all-framework-mappings.json \
            --evidence "$mapping_evidence"
          cargo run --locked --manifest-path source/company-auditor/Cargo.toml -- \
            assess \
            --manifest tests/company-readiness/company-all-framework-mappings.json \
            --evidence "$mapping_evidence" \
            --format markdown \
            --fail-on never \
            --output "$mapping_report"
          for framework in \
            cis-controls-8.1 \
            gdpr-2016-679 \
            hipaa-security-rule \
            iso-iec-27001-2022 \
            nist-800-53-r5 \
            nist-ai-rmf-1.0 \
            nist-csf-2.0 \
            pci-dss-4.0.1 \
            soc2-tsc-2017-2022; do
            grep -F "\`$framework\`" "$mapping_report"
          done
          {
            echo
            echo '## All-framework mapping coverage'
            echo
            echo '> Mapping coverage only. Inclusion here does not establish legal, contractual, regulatory, certification, or business applicability to Canonical Cloud.'
            echo
            sed -n '/## Framework profiles/,/## Findings/p' "$mapping_report"
          } >> "$GITHUB_STEP_SUMMARY"
